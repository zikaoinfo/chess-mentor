<div class="cm-board-wrap">
  <svg
    #boardSvg
    class="cm-board-svg"
    [class.cm-board-svg--dragging]="dragPiece()"
    viewBox="0 0 100 100"
    role="grid"
    [attr.aria-label]="'Échiquier, position ' + fen()"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerCancel()"
  >
    @for (sq of board(); track sq.name; let i = $index) {
      <g
        class="square"
        [class.square--interactive]="active()"
        [class.square--selected]="isSelected(sq.name)"
        (pointerdown)="onPointerDown($event, sq)"
        [attr.role]="'gridcell'"
        [attr.aria-label]="sq.name"
        [attr.aria-description]="
          sq.piece
            ? pieceNames[sq.piece.type] + (sq.piece.color === 'w' ? ' blanc' : ' noir')
            : 'Case vide'
        "
        [attr.tabindex]="active() ? 0 : -1"
        (keydown.enter)="onSquare(sq)"
        (keydown.space)="onSquare(sq)"
      >
        <rect
          class="square__bg"
          [attr.x]="(i % 8) * 12.5"
          [attr.y]="((i - (i % 8)) / 8) * 12.5"
          width="12.5"
          height="12.5"
          [attr.fill]="sq.light ? 'var(--cm-square-light)' : 'var(--cm-square-dark)'"
        />

        @if (isLast(sq.name)) {
          <rect
            class="lastmove"
            [attr.x]="(i % 8) * 12.5"
            [attr.y]="((i - (i % 8)) / 8) * 12.5"
            width="12.5"
            height="12.5"
            fill="var(--cm-lastmove-1)"
          />
        }

        @if (isSelected(sq.name)) {
          <rect
            class="selection-fill"
            [attr.x]="(i % 8) * 12.5"
            [attr.y]="((i - (i % 8)) / 8) * 12.5"
            width="12.5"
            height="12.5"
          />
        }

        @if (sq.name === checkSquare()) {
          <rect
            class="check-square"
            [attr.x]="(i % 8) * 12.5"
            [attr.y]="((i - (i % 8)) / 8) * 12.5"
            width="12.5"
            height="12.5"
          />
        }

        @if (isHintFrom(sq.name)) {
          <rect
            class="hint-square hint-square--from"
            [attr.x]="(i % 8) * 12.5"
            [attr.y]="((i - (i % 8)) / 8) * 12.5"
            width="12.5"
            height="12.5"
          />
        }
        @if (isHintTo(sq.name)) {
          <rect
            class="hint-square hint-square--to"
            [attr.x]="(i % 8) * 12.5"
            [attr.y]="((i - (i % 8)) / 8) * 12.5"
            width="12.5"
            height="12.5"
          />
        }

        <!-- Coordinates: rank on the left file, file letter on the bottom rank. -->
        @if (i % 8 === 0) {
          <text
            class="coord"
            [class.coord--on-dark]="!sq.light"
            [attr.x]="(i % 8) * 12.5 + 1"
            [attr.y]="((i - (i % 8)) / 8) * 12.5 + 3.1"
          >
            {{ sq.name.charAt(1) }}
          </text>
        }
        @if (i >= 56) {
          <text
            class="coord coord--file"
            [class.coord--on-dark]="!sq.light"
            [attr.x]="(i % 8) * 12.5 + 11.5"
            [attr.y]="((i - (i % 8)) / 8) * 12.5 + 11.6"
          >
            {{ sq.name.charAt(0) }}
          </text>
        }

        @if (isDropTarget(sq.name)) {
          <rect
            class="drop-target"
            [attr.x]="(i % 8) * 12.5 + 0.6"
            [attr.y]="((i - (i % 8)) / 8) * 12.5 + 0.6"
            width="11.3"
            height="11.3"
            rx="1.6"
          />
        }

        @if (isLegal(sq.name)) {
          @if (sq.piece) {
            <circle
              class="hint hint--capture"
              [class.hint--on-dark]="!sq.light"
              [attr.cx]="(i % 8) * 12.5 + 6.25"
              [attr.cy]="((i - (i % 8)) / 8) * 12.5 + 6.25"
              r="5.55"
            />
          } @else {
            <circle
              class="hint"
              [class.hint--on-dark]="!sq.light"
              [attr.cx]="(i % 8) * 12.5 + 6.25"
              [attr.cy]="((i - (i % 8)) / 8) * 12.5 + 6.25"
              r="2.05"
            />
          }
        }

        @if (isSelected(sq.name)) {
          <rect
            class="selection-ring"
            [attr.x]="(i % 8) * 12.5 + 0.6"
            [attr.y]="((i - (i % 8)) / 8) * 12.5 + 0.6"
            width="11.3"
            height="11.3"
            rx="1.6"
          />
        }
      </g>
    }

    <g class="pieces" aria-hidden="true">
      @for (sq of board(); track sq.name; let i = $index) {
        @if (sq.piece; as piece) {
          @for (
            identity of [piece.color + piece.type + (isLast(sq.name) ? lastMove() : '')];
            track identity
          ) {
            <image
              class="piece"
              [attr.data-square]="sq.name"
              [class.piece--ghost]="isDragSource(sq.name)"
              [attr.href]="pieceAsset(piece)"
              [attr.x]="(i % 8) * 12.5 + 0.5"
              [attr.y]="((i - (i % 8)) / 8) * 12.5 + 0.25"
              [style.--travel-x]="travel(sq.name).x + 'px'"
              [style.--travel-y]="travel(sq.name).y + 'px'"
              width="11.5"
              height="11.5"
              aria-hidden="true"
            />
          }
        }
      }
    </g>

    @if (hintArrow(); as arrow) {
      <line
        class="hint-arrow"
        [attr.x1]="arrow.x1"
        [attr.y1]="arrow.y1"
        [attr.x2]="arrow.x2"
        [attr.y2]="arrow.y2"
      />
      <circle class="hint-arrow-tip" [attr.cx]="arrow.x2" [attr.cy]="arrow.y2" r="2.1" />
    }

    <!-- Piece following the pointer during a drag — drawn last, above all. -->
    @if (dragPiece(); as d) {
      <image
        class="piece piece--drag"
        [attr.href]="pieceAsset(d.piece)"
        [attr.x]="d.x - 6.25"
        [attr.y]="d.y - 6.25"
        width="12.5"
        height="12.5"
        aria-hidden="true"
      />
    }
  </svg>

  <!-- Promotion picker — the move is held until a piece is chosen. -->
  @if (pendingPromotion(); as promo) {
    <div class="promo" role="dialog" aria-label="Choisir la pièce de promotion">
      <p class="promo__title">Promotion !</p>
      <div class="promo__choices">
        @for (p of promotionChoices; track p) {
          <button
            type="button"
            class="promo__btn"
            [class.promo__btn--white]="promo.color === 'w'"
            [class.promo__btn--black]="promo.color === 'b'"
            (click)="choosePromotion(p)"
            [attr.aria-label]="'Promouvoir en ' + pieceNames[p]"
          >
            <img [src]="pieceAsset({ color: promo.color, type: p })" alt="" /><span>{{
              pieceNames[p]
            }}</span>
          </button>
        }
      </div>
      <button type="button" class="promo__cancel" (click)="cancelPromotion()">Annuler</button>
    </div>
  }
</div>
